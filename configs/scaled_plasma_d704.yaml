# Scaled-up plasma: d_hidden = 704 (q=p=352, content channels match vanilla's full width)
# Tests whether the residual 4% gap was due to phase-space split halving content;
# at d=704, plasma's content dim is now equal to vanilla d=352's content dim.
#
# Note this is no longer param-matched to vanilla (vanilla 19M, this ~40M).
# It's a fair test of "does plasma at correct content width beat vanilla at original width".

arch: plasma
out_dir: ./logs/scaled_plasma_d704

vocab_size: 28657
d_hidden: 704                  # 11 heads × 64 head_dim
n_layers: 6
n_heads: 11
head_dim: 64
seq_len: 1024
h_step: 0.5                    # learned from A1: this is the right step
v_hidden_mult: 2               # learned from A2: bigger doesn't help
tie_embeddings: true

optimizer: symplectic_adamw
lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: true
grad_clip: 1.0

total_steps: 5000              # 1.67× original; balance compute vs convergence
warmup: 500
eig_warmup: 500
eig_max: 0.0

batch_size: 4                  # memory budget at d=704 forces batch=4
stride: 1024

log_every: 25
eval_every: 500
ckpt_every: 1000
seed: 0
