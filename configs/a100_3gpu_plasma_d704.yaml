# 3x A100 distributed plasma run.
# Launch with: bash scripts/train_3xa100.sh configs/a100_3gpu_plasma_d704.yaml

arch: plasma
out_dir: ./logs/a100_3gpu_plasma_d704

vocab_size: 28657
d_hidden: 704
n_layers: 6
n_heads: 11
head_dim: 64
seq_len: 1024
h_step: 0.5
v_hidden_mult: 2
tie_embeddings: true

optimizer: symplectic_adamw
lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: true
grad_clip: 1.0

# batch_size is per GPU when launched with torchrun.
batch_size: 4
precision: bf16
matmul_precision: high
find_unused_parameters: false
ddp_static_graph: true
num_workers: 2
pin_memory: true

total_steps: 5000
warmup: 500
eig_warmup: 500
eig_max: 0.0
stride: 1024
data_cache_dir: ./.token_cache
data_auto_prepare: true

log_every: 25
eval_every: 500
ckpt_every: 1000

# Convergence diagnostics are logged at eval/final time.
convergence_window: 40
convergence_train_slope_epsilon: 0.005
convergence_val_min_delta: 0.002
convergence_patience: 3
seed: 0
