# Ablation A1: plasma at h_step=0.5 (revert tightening)
# Question: does the h=0.5 → 0.2 tightening explain the gap?
# Baseline to beat: vanilla 374.43 @ step 3000

arch: plasma
out_dir: ./logs/ablate_A1

vocab_size: 28657
d_hidden: 352
n_layers: 6
n_heads: 11
head_dim: 32
seq_len: 1024
h_step: 0.5                    # ← the ablation: revert from 0.2 to 0.5
v_hidden_mult: 2
tie_embeddings: true

optimizer: symplectic_adamw
lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: true
grad_clip: 1.0

total_steps: 3000
warmup: 500
eig_warmup: 500
eig_max: 0.0                   # no penalty (same as v3)

batch_size: 8
stride: 1024

log_every: 25
eval_every: 500
ckpt_every: 1000
seed: 0
