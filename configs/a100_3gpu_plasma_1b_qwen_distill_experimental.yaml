# Experimental 1B-class plasma distillation config.
# Expect memory pressure; start with --steps 1 and lower seq_len/batch if needed.

arch: plasma
out_dir: ./logs/a100_3gpu_plasma_1b_qwen_distill

data_source: packed
packed_data_dir: ./data/packed/qwen36_reasoning_qwen_tok

vocab_size: 151936
d_hidden: 2048
n_layers: 32
n_heads: 32
head_dim: 64
seq_len: 1024
h_step: 0.5
v_hidden_mult: 2
tie_embeddings: true

optimizer: symplectic_adamw
lr: 1.5e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: true
grad_clip: 1.0

batch_size: 1
precision: bf16
matmul_precision: high
find_unused_parameters: false
ddp_static_graph: true
num_workers: 2
pin_memory: true

total_steps: 200000
warmup: 2000
eig_warmup: 2000
eig_max: 0.0
stride: 1024

log_every: 10
eval_every: 500
ckpt_every: 1000

convergence_window: 80
convergence_train_slope_epsilon: 0.003
convergence_val_min_delta: 0.001
convergence_patience: 4
seed: 0
