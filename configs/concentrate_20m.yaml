# Φ-CONCENTRATE — plasma v0.2
# Composes the 5 keepers from PRIME's phi-family audit (the honest 30%)
# into a single model on top of plasma's backbone.
#
# Mechanisms enabled:
#   - Plasma backbone (Hecke-Eigensheaf Attn + Symplectic-Hamiltonian flow)
#   - Koopman EDMD probe (from PHI_AEON L7)
#   - IIT-PID synergy probe (from PHI_AEON L12)
#   - Sheaf edge consistency w/ Fibonacci-skip topology (from world_model)
#
# All probe losses ramped from 0 over a warmup window — see config below.

arch: concentrate                # parsed by train.py
out_dir: ./logs/concentrate_20m

# Backbone (matches plasma A1 size)
vocab_size: 28657
d_hidden: 352
n_layers: 6
n_heads: 11
head_dim: 32
seq_len: 1024
h_step: 0.5
v_hidden_mult: 2
tie_embeddings: true

# Probes — each adds ~1-2M params
use_koopman: true
koopman_latent_dim: 32
use_iit_pid: true
iit_n_partitions: 4
use_sheaf: true
sheaf_n_edge_types: 8
sheaf_max_skip: 8

# Optimizer
optimizer: symplectic_adamw
lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: true
grad_clip: 1.0

# Schedule
total_steps: 3000
warmup: 500

# Auxiliary loss weights — small to start; they're diagnostic-priority
eig_warmup: 500
eig_max: 0.0                    # eigensheaf penalty off by default (plasma lesson)
koopman_warmup: 1000
koopman_weight: 1.0e-3          # encourages K to predict next lifted state
iit_warmup: 1000
iit_weight: 1.0e-4              # we MAXIMIZE synergy — subtracted from total
sheaf_warmup: 500
sheaf_weight: 1.0e-3            # consistency across Fibonacci-skip edges

# Data
batch_size: 8
stride: 1024

# Logging
log_every: 25
eval_every: 500
ckpt_every: 1000
seed: 0
