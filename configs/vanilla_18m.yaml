# Control: parameter-matched vanilla transformer with SymplecticAdamW.
# Same data, same optimizer, same schedule — only architecture differs.

arch: vanilla
out_dir: ./logs/v3_vanilla

vocab_size: 28657
d_hidden: 352
n_layers: 6
n_heads: 11
head_dim: 32
seq_len: 1024
ffn_mult: 4
tie_embeddings: true

optimizer: symplectic_adamw
lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: true
grad_clip: 1.0

total_steps: 3000
warmup: 500
eig_warmup: 500
eig_max: 0.0                   # vanilla baseline — match plasma's settings for direct comparison

batch_size: 4                  # halved from 8 — vanilla OOM'd at B=8 due to full (B,H,T,T) attn matrix
stride: 1024                   # effective tokens-per-step still meaningful for comparison

log_every: 25
eval_every: 500
ckpt_every: 1000
seed: 0
