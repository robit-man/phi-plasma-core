# Smoke test config — 500 steps to verify pipeline. Smaller batch, shorter context.

arch: plasma
out_dir: ./logs/smoke

vocab_size: 28657
d_hidden: 352
n_layers: 6
n_heads: 11
head_dim: 32
seq_len: 256                   # shorter context for smoke
h_step: 0.5
v_hidden_mult: 2
tie_embeddings: true

optimizer: symplectic_adamw
lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 0.05
lucas_decay: false             # disable for short smoke run
grad_clip: 1.0

total_steps: 500
warmup: 50
eig_warmup: 200
eig_max: 0.5                   # penalty is in [0, 1]; 0.5 gives meaningful contribution to ~7-NLL loss

batch_size: 4
stride: 256

log_every: 10
eval_every: 250
ckpt_every: 500
seed: 0
