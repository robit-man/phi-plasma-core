[project]
name = "phi-plasma-core"
version = "0.1.0"
description = "Tier-1 MVP: Symplectic-Hamiltonian Token Flow (S3) + Hecke-Eigensheaf Attention (S2)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4,<2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]
plot = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phi_plasma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
